# Render Blueprint — Api (Docker, plano grátis).
# Render → New → Blueprint → escolher este repositório. As variáveis com `sync: false` são pedidas na criação.
# Passo a passo em docs/DEPLOY.md.
services:
  - type: web
    name: commander500-api
    runtime: docker
    plan: free
    region: virginia            # mesma região do banco no Neon (us-east-1)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /saude
    autoDeploy: true
    buildFilter:                # só publica a Api de novo quando mudam arquivos do backend
      paths:
        - src/**
        - Dockerfile
        - Commander500.sln
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL       # connection string do Neon (postgresql://...?sslmode=require)
        sync: false
      - key: Jwt__Chave         # segredo aleatório gerado pelo Render
        generateValue: true
      - key: Admin__Email
        sync: false
      - key: Admin__Senha
        sync: false
      - key: Cors__OrigensPermitidas   # ex.: https://commander500.vercel.app
        sync: false
      - key: Semente__DadosDemonstracao
        value: "false"
      - key: Swagger__Habilitado
        value: "true"
