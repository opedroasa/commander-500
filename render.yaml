# PLANO B (não usado hoje). A publicação oficial é Vercel (site + Api) + Supabase (banco): veja docs/DEPLOY.md.
# Se um dia a Api precisar sair da Vercel, o Render roda a mesma imagem Docker de graça:
# Render → New → Blueprint → escolher este repositório. As variáveis com `sync: false` são pedidas na criação.
services:
  - type: web
    name: commander500-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./src/Dockerfile
    dockerContext: ./src
    healthCheckPath: /saude
    autoDeploy: true
    buildFilter:                # só publica a Api de novo quando mudam arquivos do backend
      paths:
        - src/**
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL       # connection string do Supabase (Session pooler)
        sync: false
      - key: Jwt__Chave         # segredo aleatório gerado pelo Render
        generateValue: true
      - key: Admin__Email
        sync: false
      - key: Admin__Senha
        sync: false
      - key: Cors__OrigensPermitidas   # endereço do site na Vercel
        sync: false
      - key: Semente__DadosDemonstracao
        value: "false"
      - key: Swagger__Habilitado
        value: "true"
