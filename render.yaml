# Render Blueprint — API (Docker, free plan).
# Render → New → Blueprint → select this repo. Secrets marked `sync: false` are asked for on creation.
# See docs/DEPLOY.md.
services:
  - type: web
    name: commander500-api
    runtime: docker
    plan: free
    region: virginia            # same region as the Neon database (us-east-1)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:                # only redeploy the API when backend files change
      paths:
        - src/**
        - Dockerfile
        - Commander500.sln
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL       # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: Jwt__Key           # random secret generated by Render
        generateValue: true
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
      - key: Cors__AllowedOrigins   # e.g. https://commander500.vercel.app
        sync: false
      - key: Seed__DemoData
        value: "false"
      - key: Swagger__Enabled
        value: "true"
