<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-fantasy-store.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1128" />
    <script>
      // Aplica o tema salvo (ou o do sistema) antes de desenhar a página, sem piscar. Ver src/utilitarios/tema.ts.
      try {
        var tema = localStorage.getItem('c500.tema')
        if (tema !== 'claro' && tema !== 'escuro') tema = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro'
        document.documentElement.dataset.tema = tema
      } catch (e) {
        document.documentElement.dataset.tema = 'escuro'
      }
    </script>
    <meta name="description" content="Liga de Commander 500 da Fantasy Store: ranking, rodadas e mesas ao vivo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Commander 500 · Fantasy Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
