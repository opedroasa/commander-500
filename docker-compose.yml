# Banco local para desenvolvimento. Subir com: docker compose up -d --wait banco
services:
  banco:
    image: postgres:16-alpine
    container_name: commander500-banco
    environment:
      POSTGRES_DB: commander500
      POSTGRES_USER: commander500
      POSTGRES_PASSWORD: commander500
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commander500 -d commander500"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opcional: rodar a Api no Docker também (docker compose --profile api up --build)
  api:
    profiles: ["api"]
    build: .
    depends_on:
      banco:
        condition: service_healthy
    environment:
      ConnectionStrings__Padrao: "Host=banco;Port=5432;Database=commander500;Username=commander500;Password=commander500"
      Jwt__Chave: "dev-only-key-change-me-0123456789-abcdefghijklmnop"
      Admin__Email: "admin@fantasystore.local"
      Admin__Senha: "admin123"
      Cors__OrigensPermitidas: "http://localhost:5173"
      Semente__DadosDemonstracao: "true"
    ports:
      - "8080:8080"

volumes:
  dados_postgres:
